[package]
name = "dropkitten"
version = "0.3.0"
edition = "2024"
description = "Dropdown terminals for Sway and niri that close when they lose focus"
license = "MIT"
repository = "https://github.com/kronberger-droid/dropkitten"

[dependencies]
swayipc-async = "3.0"
niri-ipc = { git = "https://github.com/kronberger-droid/niri.git", branch = "main" }
futures-lite = "2"
clap = { version = "4.0", features = ["derive"] }
shell-escape = "0.1"
